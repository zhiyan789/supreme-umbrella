<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鼠鼠冲冲冲</title>
<style>
:root{--acc:#ffb020;--paper:#fdf6ec;--ink:#160f2c;
 --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
 --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0d0620;font-family:var(--font);color:var(--paper);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#stage{position:relative;width:min(430px,100%);height:min(880px,100%);border-radius:22px;overflow:hidden;
 box-shadow:0 26px 70px rgba(0,0,0,.55);background:#12071f;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;font-weight:800}
.hudTop{display:flex;justify-content:space-between;padding:14px 16px}
.scoreNum{font-size:36px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.scoreSub{font-size:12px;opacity:.75;margin-top:5px}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:15px;cursor:pointer}
.hearts{display:flex;align-items:center;gap:3px;margin-top:8px;font-family:var(--emoji);font-size:15px;line-height:1;
 text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hearts:empty{display:none}
.hearts .hp{display:block;width:78px;height:9px;border-radius:5px;background:rgba(8,4,18,.55);overflow:hidden;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.hearts .hp b{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9f5a);transition:width .18s}
.hearts .num{font-family:var(--font);font-size:11.5px;font-weight:800;opacity:.8;margin-left:5px}
.hearts.low{animation:hbeat .7s infinite}
@keyframes hbeat{50%{opacity:.4}}
#buffs{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:7px}
.buff{display:flex;align-items:center;gap:7px;background:rgba(10,6,24,.5);border-radius:11px;padding:5px 9px}
.buff span{font-size:16px;font-family:var(--emoji);line-height:1}
.buff i{display:block;width:52px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.buff i b{display:block;height:100%;background:var(--acc)}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;
 opacity:0;transition:opacity .3s;text-shadow:0 3px 0 rgba(0,0,0,.4);white-space:nowrap;color:var(--acc)}
#toast.on{opacity:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:22px 20px 26px;overflow:auto;
 background:linear-gradient(180deg,rgba(10,6,20,.88),rgba(6,3,14,.96))}
.screen.on{display:flex}
h1{font-size:42px;line-height:.95;margin:6px 0 6px;font-weight:900;letter-spacing:-1.5px}
h1 em{font-style:normal;display:block;color:var(--acc)}
.brand{font-size:12px;letter-spacing:5px;opacity:.55;font-weight:800}
.lede{font-size:13px;line-height:1.7;opacity:.75;margin:0 0 20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:900;
 font-family:var(--font);cursor:pointer;margin-bottom:10px;color:var(--ink);background:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.main{background:var(--acc);font-size:18px}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--paper);box-shadow:none}
.row{display:flex;gap:9px}.row .btn{flex:1}
.spacer{flex:1;min-height:12px}
.tip{font-size:11.5px;line-height:1.7;opacity:.6}
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.backbar button{border:0;background:rgba(255,255,255,.14);color:var(--paper);width:36px;height:36px;border-radius:12px;font-size:17px;cursor:pointer}
.backbar h2{margin:0;font-size:20px}
.skinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.skin{background:rgba(255,255,255,.09);border:2px solid transparent;border-radius:16px;padding:11px 5px;text-align:center;cursor:pointer}
.skin .face{font-size:33px;font-family:var(--emoji);line-height:1.15;height:42px;display:flex;align-items:center;justify-content:center}
.skin .face img{max-width:40px;max-height:40px;object-fit:contain}
.skin .nm{font-size:11.5px;font-weight:800;margin-top:5px}
.skin .cond{font-size:10px;opacity:.6;margin-top:2px;font-weight:700}
.skin.sel{border-color:var(--acc);background:rgba(255,255,255,.16)}
.skin.lock{opacity:.42}.skin.lock .face{filter:grayscale(1)}
#scMenu{padding:0}
#coverImg,#coverMask{position:absolute;inset:0}
#coverImg{background-position:center;background-size:cover;background-repeat:no-repeat}
#coverText{position:absolute;display:flex;flex-direction:column;z-index:2}
#coverText h1{margin:2px 0 8px}
#coverText .lede{margin:0 0 7px}
#coverText .best{font-size:12px;font-weight:800;opacity:.72;margin-top:2px}
#gLogo{display:none;max-width:100%;max-height:150px;object-fit:contain;margin-bottom:6px}
#menuBar{position:absolute;left:20px;right:20px;bottom:24px;z-index:2}
#menuBar .tip{margin-top:10px}
.finalWrap{text-align:center;margin:auto 0}
.finalScore{font-size:74px;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 5px 0 rgba(0,0,0,.35)}
.finalLbl{font-size:12px;letter-spacing:4px;opacity:.6;font-weight:800;margin-bottom:12px}
.stats{display:flex;justify-content:center;gap:26px;margin:18px 0 6px}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;opacity:.6}
.newSkin{background:rgba(255,255,255,.1);border:1px dashed var(--acc);border-radius:16px;padding:12px;margin-top:16px;font-size:13px;font-weight:800}
.newSkin em{font-style:normal;font-family:var(--emoji);font-size:22px;vertical-align:-3px}
.newSkin em img{width:24px;height:24px;object-fit:contain;vertical-align:-5px}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="hudTop">
    <div><div class="scoreNum" id="hScore">0</div><div class="scoreSub">最高 <span id="hBest">0</span></div>
      <div class="hearts" id="hearts"></div></div>
    <button id="pauseBtn">❚❚</button>
  </div>
  <div id="buffs"></div><div id="toast"></div>
</div>
<div class="screen on" id="scMenu">
  <div id="coverImg"></div>
  <div id="coverMask"></div>
  <div id="coverText">
    <div class="brand" id="gBrand">JUMP</div>
    <img id="gLogo" alt="">
    <h1 id="gH1"><em id="gTitle"></em></h1>
    <div class="lede" id="gSubBox"><span id="gSub"></span></div>
    <div class="lede" id="gHelpBox"><span id="gHelp"></span></div>
    <div class="best" id="gBestBox">历史最高 <b id="mBest">0</b></div>
  </div>
  <div id="menuBar">
    <button class="btn main" id="btnPlay">开始游戏</button>
    <button class="btn ghost" id="btnSkins">选择角色</button>
    <div class="tip" id="gTip">电脑：← → 或 A D 左右移动｜手机：按住屏幕左右滑动<br>角色自动起跳，你只管左右；冲出一边会从另一边出来。</div>
  </div>
</div>
<div class="screen" id="scSkins">
  <div class="backbar"><button data-back>←</button><h2>选择角色</h2></div>
  <div class="skinGrid" id="skinGrid"></div>
  <div class="tip" id="skinTip" style="margin-top:14px"></div>
</div>
<div class="screen" id="scPause">
  <div class="finalWrap"><h1 style="font-size:34px">暂停中</h1></div>
  <button class="btn main" id="btnResume">继续游戏</button>
  <button class="btn ghost" id="btnRestart">重新开始</button>
  <button class="btn ghost" id="btnHome2">回到主菜单</button>
</div>
<div class="screen" id="scOver">
  <div class="finalWrap">
    <div class="finalLbl">本次得分</div>
    <div class="finalScore" id="fScore">0</div>
    <div class="stats">
      <div class="stat"><b id="fBest">0</b><span>历史最高</span></div>
      <div class="stat"><b id="fCoin">0</b><span>吃到道具</span></div>
      <div class="stat" id="fHurtBox"><b id="fHurt">0</b><span>受伤次数</span></div>
    </div>
    <div class="newSkin" id="fUnlock" style="display:none"></div>
  </div>
  <button class="btn main" id="btnAgain">再来一次</button>
  <div class="row"><button class="btn ghost" id="btnSkins2">选择角色</button><button class="btn ghost" id="btnHome">主菜单</button></div>
</div>
</div>

const 图片库=new Map();
function 取图案(s){
  if(!s) return null; s=String(s).trim(); if(!s) return null;
  if(/^(https?:\/\/|data:image)/i.test(s)){
    let o=图片库.get(s);
    if(!o){ o={类型:'图片',好了:false,img:new Image()}; o.img.onload=()=>o.好了=true; o.img.src=s; 图片库.set(s,o); }
    return o.好了?o:null;
  }
  return {类型:'文字',文字:s};
}
function 画图案(a,x,y,w,h){
  if(!a) return false;
  if(a.类型==='图片'){
    const r=a.img.width/a.img.height, W2=r>=1?w:h*r, H2=r>=1?w/r:h;
    ctx.drawImage(a.img,x-W2/2,y-H2/2,W2,H2); return true;
  }
  ctx.font=Math.round(h)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(a.文字,x,y+1); return true;
}
function 圆角(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function 混色(a,b,t){ const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
  const X=p(a),Y=p(b); return 'rgb('+Math.round(lerp(X[0],Y[0],t))+','+Math.round(lerp(X[1],Y[1],t))+','+Math.round(lerp(X[2],Y[2],t))+')'; }

const D = A.装饰 || { 云朵:{开:(+A.云朵数量||0)>0, 数量:+A.云朵数量||0, 颜色:''} };
const 开了 = k => !!(D[k] && D[k].开 && (+D[k].数量||0)>0);
function 装饰色(k){
  const c = D[k] && D[k].颜色;
  if(c) return c;
  if(k==='云朵'||k==='星星'||k==='雨丝'||k==='泡泡') return A.云色;
  if(k==='远山') return 混色(A.天空下,A.夜色,.78);
  if(k==='飞鸟') return 混色(A.夜色,A.天空上,.35);
  if(k==='气球'||k==='萤火虫') return A.高亮;
  if(k==='花瓣') return '#ffb3d9';
  return '#ffffff';
}
let 装饰组={};
function 建装饰(){
  装饰组={};
  for(const k in D){
    if(!开了(k)) continue;
    const n=Math.round(+D[k].数量||0), a=[];
    if(k==='云朵')      for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(-H*2,H),r:rand(26,72),a:rand(.05,.14)});
    else if(k==='星星') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(-H*2,H),r:rand(.7,1.9),a:rand(.35,1),p:rand(0,6.3)});
    else if(k==='远山') for(let i=0;i<Math.min(n,5);i++) a.push({i:i});
    else if(k==='飞鸟') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(-H*1.6,H),v:rand(.5,1.4)*(Math.random()<.5?-1:1),s:rand(6,11),p:rand(0,6.3)});
    else if(k==='气球') for(let i=0;i<n;i++) a.push({x:rand(24,Math.max(30,W-24)),y:rand(-H*1.4,H),r:rand(9,17),v:rand(.18,.42),p:rand(0,6.3)});
    else if(k==='流星') for(let i=0;i<Math.min(n,8);i++) a.push({活:false,x:0,y:0,vx:0,vy:0,life:0});
    else if(k==='雪花') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(0,H),r:rand(1.4,3.4),v:rand(.5,1.5),p:rand(0,6.3)});
    else if(k==='雨丝') for(let i=0;i<n;i++) a.push({x:rand(0,W*1.2),y:rand(0,H),L:rand(9,20),v:rand(7,12)});
    else if(k==='花瓣') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(0,H),r:rand(2.6,5),v:rand(.5,1.2),p:rand(0,6.3),旋:rand(0,6.3)});
    else if(k==='泡泡') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(0,H),r:rand(3,9),v:rand(.4,1.1),p:rand(0,6.3)});
    else if(k==='萤火虫') for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(0,H),r:rand(1.4,2.6),p:rand(0,6.3),q:rand(0,6.3)});
    装饰组[k]=a;
  }
}
function 装饰更新(dt){
  帧时+=dt;
  const g=装饰组;
  if(g.云朵) for(const c of g.云朵) if(c.y>相机+H+90){ c.y-=H*2.4; c.x=rand(0,W); }
  if(g.星星) for(const s of g.星星) if(s.y>相机+H+40){ s.y-=H*2.4; s.x=rand(0,W); }
  if(g.飞鸟) for(const b of g.飞鸟){ b.x+=b.v*dt;
    if(b.x<-32) b.x=W+28; else if(b.x>W+32) b.x=-28;
    if(b.y>相机+H+70) b.y-=H*2.2; }
  if(g.气球) for(const b of g.气球){ b.y-=b.v*dt; b.x+=Math.sin(帧时*.01+b.p)*.22*dt;
    if(b.y-相机<-90){ b.y=相机+H+rand(30,H); b.x=rand(24,Math.max(30,W-24)); }
    else if(b.y-相机>H+H*1.6){ b.y=相机-rand(20,H); b.x=rand(24,Math.max(30,W-24)); } }
  if(g.流星){ const 率=Math.min(.02,(+D.流星.数量||1)*.0009);
    for(const m of g.流星){
      if(m.活){ m.x+=m.vx*dt; m.y+=m.vy*dt; m.life-=dt; if(m.life<=0||m.y>H+50) m.活=false; }
      else if(Math.random()<率){ const s=rand(7,12);
        m.活=true; m.x=rand(W*.15,W*1.1); m.y=rand(-20,H*.45); m.vx=-s*.78; m.vy=s*.52; m.life=rand(26,46); } } }
  if(g.雪花) for(const s of g.雪花){ s.y+=s.v*dt; s.x+=Math.sin(帧时*.02+s.p)*.45*dt;
    if(s.y>H+6){ s.y=-6; s.x=rand(0,W); } if(s.x<-8) s.x=W+6; else if(s.x>W+8) s.x=-6; }
  if(g.雨丝) for(const r of g.雨丝){ r.y+=r.v*dt; r.x-=r.v*.26*dt;
    if(r.y>H+12){ r.y=-16; r.x=rand(0,W*1.2); } if(r.x<-24) r.x=W+12; }
  if(g.花瓣) for(const f of g.花瓣){ f.y+=f.v*dt; f.x+=Math.sin(帧时*.025+f.p)*.75*dt; f.旋+=.032*dt;
    if(f.y>H+8){ f.y=-8; f.x=rand(0,W); } if(f.x<-10) f.x=W+8; else if(f.x>W+10) f.x=-8; }
  if(g.泡泡) for(const b of g.泡泡){ b.y-=b.v*dt; b.x+=Math.sin(帧时*.03+b.p)*.55*dt;
    if(b.y<-12){ b.y=H+8; b.x=rand(0,W); } if(b.x<-12) b.x=W+8; else if(b.x>W+12) b.x=-8; }
  if(g.萤火虫) for(const f of g.萤火虫){ f.x+=Math.cos(帧时*.012+f.p)*.5*dt; f.y+=Math.sin(帧时*.017+f.q)*.45*dt;
    if(f.x<-10) f.x=W+8; else if(f.x>W+10) f.x=-8;
    if(f.y<-10) f.y=H+8; else if(f.y>H+10) f.y=-8; }
}
function 画后景装饰(阶段){
  const g=装饰组, d=难度();
  if(阶段===1){
    if(g.星星){
    ctx.fillStyle=装饰色('星星');
    for(const s of g.星星){
      const y=((s.y-相机*.12)%(H*3)+H*3)%(H*3)-H; if(y<-10||y>H+10) continue;
      ctx.globalAlpha=clamp(s.a*(.3+.7*d)*(.62+.38*Math.sin(帧时*.05+s.p)),0,1);
      ctx.beginPath(); ctx.arc(s.x,y,s.r,0,6.3); ctx.fill();
    }
    ctx.globalAlpha=1;
    }
    return;
  }
  if(g.远山){
    const 淡=clamp(1-(-相机)/(H*1.9),0,1);
    if(淡>.02){
      ctx.fillStyle=装饰色('远山');
      for(const m of g.远山){
        const i=m.i, y=H-10-i*26+(-相机)*(.08+.035*i);
        if(y>H+80) continue;
        ctx.globalAlpha=淡*(.92-i*.15);
        const w=W/(2.4+i*.9);
        ctx.beginPath(); ctx.moveTo(-12,y);
        let n=0;
        for(let x=-12;x<W+24;x+=w){ const h=34+(Math.sin(i*7.3+n*2.7)*.5+.5)*(66-i*9);
          ctx.lineTo(x+w/2,y-h); ctx.lineTo(x+w,y); n++; }
        ctx.lineTo(W+24,H+60); ctx.lineTo(-12,H+60); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
  if(g.云朵){
    ctx.fillStyle=装饰色('云朵');
    for(const c of g.云朵){ const y=((c.y-相机*.35)%(H*3)+H*3)%(H*3)-H;
      ctx.globalAlpha=c.a; ctx.beginPath(); ctx.ellipse(c.x,y,c.r*1.5,c.r*.62,0,0,6.3); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  if(g.气球){
    for(const b of g.气球){ const y=b.y-相机; if(y<-60||y>H+60) continue;
      ctx.globalAlpha=.85; ctx.fillStyle=装饰色('气球');
      ctx.beginPath(); ctx.ellipse(b.x,y,b.r*.82,b.r,0,0,6.3); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.2)';
      ctx.beginPath(); ctx.ellipse(b.x+b.r*.34,y,b.r*.24,b.r*.9,0,0,6.3); ctx.fill();
      ctx.fillStyle=装饰色('气球');
      ctx.beginPath(); ctx.moveTo(b.x-b.r*.42,y+b.r*.78); ctx.lineTo(b.x+b.r*.42,y+b.r*.78);
      ctx.lineTo(b.x+b.r*.22,y+b.r*1.3); ctx.lineTo(b.x-b.r*.22,y+b.r*1.3); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(g.飞鸟){
    ctx.strokeStyle=装饰色('飞鸟'); ctx.lineWidth=1.7;
    for(const b of g.飞鸟){ const y=b.y-相机; if(y<-30||y>H+30) continue;
      const f=Math.sin(帧时*.13+b.p)*.5+.5, w=b.s, h=b.s*(.3+f*.5);
      ctx.globalAlpha=.55;
      ctx.beginPath(); ctx.moveTo(b.x-w,y); ctx.quadraticCurveTo(b.x-w*.5,y-h,b.x,y);
      ctx.quadraticCurveTo(b.x+w*.5,y-h,b.x+w,y); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(g.流星){
    ctx.strokeStyle=装饰色('流星'); ctx.lineWidth=2;
    for(const m of g.流星){ if(!m.活) continue;
      ctx.globalAlpha=clamp(m.life/30,0,1)*.9;
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.vx*4.5,m.y-m.vy*4.5); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}
function 画前景装饰(){
  const g=装饰组;
  if(g.雨丝){ ctx.strokeStyle=装饰色('雨丝'); ctx.lineWidth=1.2; ctx.globalAlpha=.34;
    for(const r of g.雨丝){ ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-r.L*.26,r.y+r.L); ctx.stroke(); }
    ctx.globalAlpha=1; }
  if(g.雪花){ ctx.fillStyle=装饰色('雪花'); ctx.globalAlpha=.78;
    for(const s of g.雪花){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.3); ctx.fill(); }
    ctx.globalAlpha=1; }
  if(g.花瓣){ ctx.fillStyle=装饰色('花瓣'); ctx.globalAlpha=.8;
    for(const f of g.花瓣){ ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.旋);
      ctx.beginPath(); ctx.ellipse(0,0,f.r,f.r*.55,0,0,6.3); ctx.fill(); ctx.restore(); }
    ctx.globalAlpha=1; }
  if(g.泡泡){ ctx.strokeStyle=装饰色('泡泡'); ctx.lineWidth=1.2;
    for(const b of g.泡泡){ ctx.globalAlpha=.4;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.3); ctx.stroke();
      ctx.globalAlpha=.22; ctx.fillStyle=装饰色('泡泡');
      ctx.beginPath(); ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.3,0,6.3); ctx.fill(); }
    ctx.globalAlpha=1; }
  if(g.萤火虫){ ctx.save(); ctx.shadowColor=装饰色('萤火虫'); ctx.shadowBlur=9; ctx.fillStyle=装饰色('萤火虫');
    for(const f of g.萤火虫){ ctx.globalAlpha=clamp(.35+.65*(Math.sin(帧时*.06+f.p)*.5+.5),0,1);
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.3); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha=1; }
}

function 开局(){
  平台组=[];道具组=[];碎片组=[];飘字组=[];相机=0;高度分=0;道具分=0;吃到数=0;
  激活={}; 输入=0; 手指X=null;
  血=起始血; 血上限=起始上限; 受伤计时=0; 救起冷却=0; 红闪=0; 受伤数=0;
  const hb=$('#hearts'); if(hb) hb._k='';
  玩家={x:W/2-基础大小/2,y:H-160,w:基础大小,h:基础大小,vx:0,vy:-(+N.跳跃力),朝向:1};
  建装饰();
  平台组.push(造平台(平台表[0],W/2-70,H-90,140)); 顶端=H-90;
  while(顶端>相机-H) 生成();
  状态='play';
}
function 造平台(def,x,y,w){
  return {x:x,y:y,基y:y,w:w,h:15,def:def,效果:def.效果||'普通',参数:+def.参数||0,
          透明:1,相位:Math.random()*6.28,dir:Math.random()<.5?-1:1};
}
function 挑平台(d){
  let 池=平台表;
  const 尾=平台组.slice(-2);
  if(尾.length===2 && 尾.every(p=>安全效果.indexOf(p.效果)<0)){
    const s=平台表.filter(p=>安全效果.indexOf(p.效果||'普通')>=0);
    if(s.length) 池=s;
  }
  let 总=0; const ws=[];
  for(const p of 池){ const w=Math.max(0,lerp(+p.起始比重||0,+p.最终比重||0,d)); ws.push(w); 总+=w; }
  if(总<=0) return 池[0];
  let r=Math.random()*总;
  for(let i=0;i<池.length;i++){ if(r<ws[i]) return 池[i]; r-=ws[i]; }
  return 池[0];
}
function 挑道具(){
  let 总=0; for(const it of 道具表) 总+=Math.max(0,+it.比重||0);
  if(总<=0) return null;
  let r=Math.random()*总;
  for(const it of 道具表){ const w=Math.max(0,+it.比重||0); if(r<w) return it; r-=w; }
  return 道具表[0];
}
function 生成(){
  const d=难度();
  顶端 -= lerp(+N.起始间距,+N.最终间距,d)*rand(.86,1.1);
  const w=Math.max(34,(+N.平台宽度)*lerp(1,.62,d));
  const def=挑平台(d);
  const p=造平台(def,rand(6,W-w-6),顶端,w);
  平台组.push(p);
  if(Math.random()*100 < +N.道具概率 && p.效果!=='易碎' && p.效果!=='危险'){
    const it=挑道具();
    if(it) 道具组.push({x:p.x+p.w/2,y:p.y-IS-8,起点:p.y-IS-8,def:it,r:IS/2,吃了:false});
  }
}
function 更新(dt){
  时间+=dt;
  if(受伤计时>0) 受伤计时-=dt;
  if(救起冷却>0) 救起冷却-=dt;
  if(红闪>0) 红闪-=dt;
  for(const k in 激活){ 激活[k].剩-=dt; if(激活[k].剩<=0) delete 激活[k]; }
  const 稳定=有('稳定器');

  // 体型
  const 目标=基础大小*(有('变大')?值('变大',1.6):(有('变小')?值('变小',.62):1));
  if(Math.abs(玩家.w-目标)>0.2){
    const cx=玩家.x+玩家.w/2, cy=玩家.y+玩家.h/2;
    玩家.w=玩家.h=目标; 玩家.x=cx-目标/2; 玩家.y=cy-目标/2;
  }
  const 半=玩家.w/2;

  // 左右
  const 速度=(+N.左右速度)*(有('加速')?值('加速',1.7):1);
  const 反=有('反向')?-1:1;
  const 目标X = 手指X!==null ? clamp(((手指X-半-玩家.x)*.28)*反,-速度*1.4,速度*1.4) : 输入*速度*反;
  玩家.vx=lerp(玩家.vx,目标X,.35); 玩家.x+=玩家.vx*dt;
  if(Math.abs(玩家.vx)>.6) 玩家.朝向=玩家.vx>0?1:-1;
  if(玩家.x<-玩家.w) 玩家.x=W; else if(玩家.x>W) 玩家.x=-玩家.w;

  // 上下
  const 前底=玩家.y+玩家.h;
  if(有('冲刺')){ 玩家.vy=-(+N.跳跃力)*值('冲刺',1.2); }
  else {
    let g=(+N.重力)*(有('慢动作')?值('慢动作',.55):1);
    if(有('缓降')&&玩家.vy>0){ g*=值('缓降',.45); 玩家.vy=Math.min(玩家.vy,12*值('缓降',.45)); }
    玩家.vy+=g*dt;
  }
  玩家.y+=玩家.vy*dt;

  // 平台自身行为
  for(const p of 平台组){
    if(p.效果==='移动'&&!稳定){ p.x+=p.dir*(p.参数||1.6)*dt;
      if(p.x<4){p.x=4;p.dir=1;} if(p.x+p.w>W-4){p.x=W-4-p.w;p.dir=-1;} }
    if(p.效果==='上下') p.y=p.基y+Math.sin(时间*.022*(p.参数||1)+p.相位)*34;
    if(p.效果==='幽灵') p.可见 = 稳定 ? true : Math.sin(时间*.045*(p.参数||1)+p.相位)>-.25;
    if(p.掉了) p.y+=(p.参数||3)*dt;
    if(p.碎了){ p.透明-=dt*.06; p.y+=dt*2.5; }
  }
  // 落到平台
  if(玩家.vy>0&&!有('冲刺')){
    const 底=玩家.y+玩家.h;
    for(const p of 平台组){
      if(p.碎了) continue;
      if(p.效果==='幽灵'&&!p.可见) continue;
      if(前底<=p.y+2&&底>=p.y&&玩家.x+玩家.w>p.x+4&&玩家.x<p.x+p.w-4){
        const e=p.效果, v=p.参数;
        if(e==='危险'){
          if(受伤(+L.危险扣血||1,false)) return;
          玩家.vy=-(+N.跳跃力)*1.6; 玩家.y=p.y-玩家.h;
        } else {
          let 倍=1;
          if(e==='弹簧') 倍=v||1.75;
          if(e==='黏性') 倍=v||.62;
          玩家.vy=-(+N.跳跃力)*倍; 玩家.y=p.y-玩家.h;
          if(e==='传送带') 玩家.vx+=(v||5);
          if(e==='加分'){ 加分(v||30,p.x+p.w/2,p.y); }
          if(e==='易碎'&&!稳定){ p.碎了=true; 屑(p,p.def.颜色); }
          if(e==='掉落') p.掉了=true;
          响(e==='弹簧'?760:(e==='黏性'?260:430),e==='弹簧'?.1:.06);
        }
        break;
      }
    }
  }

  const 线=H*0.42;
  if(玩家.y-相机<线){ 相机=玩家.y-线; 高度分=Math.max(高度分,Math.floor(-相机/8)); }
  while(顶端>相机-H) 生成();
  平台组=平台组.filter(p=>p.y<相机+H+160&&p.透明>0);
  道具组=道具组.filter(d=>d.y<相机+H+160&&!d.吃了);

  const 吸=有('磁铁')?值('磁铁',170):0;
  for(const d of 道具组){
    d.y=d.起点+Math.sin(时间*.06+d.x)*4;
    if(吸>0&&d.def.效果==='加分'){
      const dx=(玩家.x+半)-d.x, dy=(玩家.y+半)-d.y, L=Math.hypot(dx,dy);
      if(L<吸){ d.起点+=dy/L*7*dt; d.x+=dx/L*7*dt; }
    }
    if(Math.hypot((玩家.x+半)-d.x,(玩家.y+半)-d.y)<d.r+半){ 吃(d); if(状态!=='play') return; }
  }
  for(const s of 碎片组){ s.vy+=.35*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; }
  碎片组=碎片组.filter(s=>s.life>0);
  for(const t of 飘字组){ t.y-=dt*1.1; t.life-=dt; }
  飘字组=飘字组.filter(t=>t.life>0);

  if(玩家.y-相机>H+50){
    if(救起冷却>0){ 救起(); }
    else if(受伤(+L.掉落扣血||1,true)) return;
    else { 救起(); if(血开) 提示('还剩 '+血+' 颗心'); else 提示('被救了一次'); }
  }
  HUD();
}
function 加分(v,x,y){
  const m=有('吃分翻倍')?值('吃分翻倍',2):1;
  const 得=Math.round((+v||0)*m);
  道具分+=得;
  飘字组.push({x:x,y:y,文:(得>=0?'+':'')+得,life:50});
}
/* 受伤：返回 true 表示这一下把命打没了（已经调用 结束()）
   强制=true 时忽略「受伤后短暂无敌」，用于掉出屏幕和致命陷阱 */
function 受伤(量,强制){
  if(状态!=='play') return true;
  if(!强制 && 受伤计时>0) return false;
  if(有('无敌')){ 提示('无敌中'); 响(520,.12); return false; }
  if(有('护盾')){ delete 激活.护盾; 提示('护盾挡下了'); 响(300,.2); 受伤计时=Math.max(受伤计时,40); return false; }
  if(!血开){ 结束(); return true; }
  const 扣=Math.max(1,Math.round(+量||1));
  血=Math.max(0,血-扣); 受伤数++;
  红闪=Math.max(红闪,20); 响(210,.28);
  const 半=玩家?玩家.w/2:0;
  if(玩家) 飘字组.push({x:玩家.x+半,y:玩家.y,文:'-'+扣+'♥',life:52,色:'#ff5f7a'});
  if(血<=0){ 结束(); return true; }
  受伤计时=Math.max(30,(+L.无敌秒数||1.2)*60);
  return false;
}
function 回血(量,x,y){
  const 补=Math.max(1,Math.round(+量||1));
  const 前=血; 血=Math.min(血上限,血+补);
  const 实=血-前;
  飘字组.push({x:x,y:y,文:(实>0?'+'+实+'♥':'已满'),life:52,色:'#6ee7a8'});
  响(实>0?900:400,.12);
}
function 救起(){
  const 表=平台表.filter(p=>安全效果.indexOf(p.效果||'普通')>=0);
  const 底=表.length?表[0]:平台表[0];
  玩家.x=clamp(玩家.x,4,Math.max(4,W-玩家.w-4));
  玩家.y=相机+H-20; 玩家.vy=-(+N.跳跃力)*1.9;
  平台组.push(造平台(底,clamp(玩家.x-20,4,Math.max(4,W-90)),相机+H-8,86));
  救起冷却=55; 响(300,.2);
}
function 吃(d){
  d.吃了=true; 吃到数++;
  const it=d.def, e=it.效果||'加分', v=+it.数值||0, t=(+it.时长||0)*60;
  if(e==='加分'){ 加分(v,d.x,d.y); 响(880,.07); return; }
  if(e==='扣分'){ 道具分-=Math.round(v); 飘字组.push({x:d.x,y:d.y,文:'-'+Math.round(v),life:50}); 响(200,.2); 提示(it.名称); return; }
  if(e==='回血'){ if(血开) 回血(v||1,d.x,d.y); 提示(it.名称); return; }
  if(e==='加满血'){ if(血开) 回血(血上限,d.x,d.y); 提示(it.名称); return; }
  if(e==='血上限'){
    if(血开){ const 加=Math.max(1,Math.round(v||1)); 血上限=Math.min(20,血上限+加); 血=Math.min(血上限,血+加);
      飘字组.push({x:d.x,y:d.y,文:'上限+'+加,life:52,色:'#6ee7a8'}); 响(980,.16); }
    提示(it.名称); return;
  }
  if(e==='扣血'){ if(受伤(v||1,false)) return; 提示(it.名称); return; }
  if(e==='超级跳'){ 玩家.vy=-(+N.跳跃力)*(v||2.4); 响(900,.14); 提示(it.名称); return; }
  if(e==='砸下去'){ 玩家.vy=Math.abs(v||9); 响(150,.25); 提示(it.名称); return; }
  if(e==='立刻结束'){
    if(受伤(血上限,true)) return;
    提示(it.名称); return;
  }
  const 总=t||600;
  激活[e]={剩:总,总:总,值:v,图:it.图案,名:it.名称};
  提示(it.名称); 响(620,.15);
  屑({x:d.x-14,y:d.y,w:28},A.高亮);
}
function 屑(p,色){ for(let i=0;i<9;i++) 碎片组.push({x:p.x+(p.w||30)/2,y:p.y,vx:rand(-3,3),vy:rand(-3.5,.5),life:rand(18,34),色:色||'#fff',r:rand(2,4.5)}); }
function 提示(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); 提示计时=100; }

function 画背景(){
  const d=难度(), g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,混色(A.天空上,A.夜色,d*.8));
  g.addColorStop(.5,混色(A.天空中,A.夜色,d*.8));
  g.addColorStop(1,混色(A.天空下,A.夜色,d*.62));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  画后景装饰(1);
  if(A.背景图){
    const im=取图案(A.背景图);
    if(im&&im.类型==='图片'){
      ctx.globalAlpha=clamp((+A.背景浓度||70)/100,0,1);
      if(A.背景模式==='固定') ctx.drawImage(im.img,0,0,W,H);
      else{
        const h=Math.max(40,W*im.img.height/im.img.width);
        let off=(-相机*(A.背景模式==='视差'?0.28:0.75))%h; if(off>0) off-=h;
        for(let y=off;y<H;y+=h) ctx.drawImage(im.img,0,y,W,h);
      }
      ctx.globalAlpha=1;
    }
  }
  画后景装饰(2);
}
const 记号={移动:'↔',上下:'↕',弹簧:'▲',黏性:'≈',加分:'＋',危险:'✖',掉落:'▼'};
function 绘制(){
  画背景();
  if(C.信息.显示刻度){
    ctx.font='700 10px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle';
    for(let s=Math.floor(高度分/500)*500;s<高度分+H/8+500;s+=500){
      if(s<=0) continue; const y=-s*8-相机; if(y<-20||y>H+20) continue;
      ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fillText(s+'',6,y-8);
    }
  }
  for(const p of 平台组){
    const y=p.y-相机; if(y<-40||y>H+40) continue;
    ctx.globalAlpha=clamp(p.透明*(p.效果==='幽灵'?(p.可见?1:.22):1),0,1);
    const 图=取图案(p.def.图案);
    if(图&&图.类型==='图片'){
      if(A.平台描边){ ctx.fillStyle='rgba(0,0,0,.35)'; 圆角(p.x-2,y-2,p.w+4,p.h+8,8); ctx.fill(); }
      ctx.drawImage(图.img,p.x,y-4,p.w,p.h+8);
    } else if(图){
      const s=24,n=Math.max(1,Math.round(p.w/s)); ctx.fillStyle='#fff';
      for(let i=0;i<n;i++) 画图案(图,p.x+p.w*(i+.5)/n,y+4,s,s);
    } else {
      ctx.fillStyle='rgba(0,0,0,.28)'; 圆角(p.x,y+4,p.w,p.h,7); ctx.fill();
      ctx.fillStyle=p.def.颜色||'#5fd97a'; 圆角(p.x,y,p.w,p.h,7); ctx.fill();
      if(A.平台描边){ ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=2; 圆角(p.x,y,p.w,p.h,7); ctx.stroke(); }
      ctx.fillStyle='rgba(255,255,255,.34)'; 圆角(p.x+5,y+3,p.w-10,4,2); ctx.fill();
      if(p.效果==='易碎'){ ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1.6; ctx.beginPath();
        ctx.moveTo(p.x+p.w*.35,y); ctx.lineTo(p.x+p.w*.45,y+p.h);
        ctx.moveTo(p.x+p.w*.68,y); ctx.lineTo(p.x+p.w*.6,y+p.h); ctx.stroke(); }
      else if(p.效果==='传送带'){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.font='700 11px system-ui';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.参数<0?'«':'»',p.x+p.w/2,y+8); }
      else if(记号[p.效果]){ ctx.fillStyle=(p.效果==='弹簧'||p.效果==='加分')?'rgba(0,0,0,.5)':'rgba(255,255,255,.8)';
        ctx.font='700 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(记号[p.效果],p.x+p.w/2,y+8); }
    }
    ctx.globalAlpha=1;
  }
  for(const d2 of 道具组){
    const y=d2.y-相机; if(y<-40||y>H+40) continue;
    const 图=取图案(d2.def.图案)||{类型:'文字',文字:'★'};
    ctx.save(); ctx.shadowColor='rgba(255,220,120,.8)'; ctx.shadowBlur=12; ctx.fillStyle='#fff';
    画图案(图,d2.x,y,IS,IS); ctx.restore();
  }
  for(const s of 碎片组){ ctx.globalAlpha=clamp(s.life/30,0,1); ctx.fillStyle=s.色;
    ctx.beginPath(); ctx.arc(s.x,s.y-相机,s.r,0,6.3); ctx.fill(); }
  ctx.globalAlpha=1;
  if(玩家){
    const py=玩家.y-相机, 半=玩家.w/2, 皮=C.皮肤[存档.当前皮肤]||C.皮肤[0];
    if(有('冲刺')){ ctx.globalAlpha=.85;
      for(let i=0;i<3;i++){ ctx.fillStyle=i%2?'#ffb020':'#ff6b3d';
        ctx.beginPath(); ctx.ellipse(玩家.x+半,py+玩家.h+i*11,9-i*2.2,15-i*3,0,0,6.3); ctx.fill(); }
      ctx.globalAlpha=1; }
    if(有('护盾')){ ctx.strokeStyle='rgba(120,230,255,'+(0.5+Math.sin(时间*.15)*0.3)+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(玩家.x+半,py+半,半+9,0,6.3); ctx.stroke(); }
    if(有('反向')){ ctx.strokeStyle='rgba(255,110,199,.7)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(玩家.x+半,py+半,半+15,时间*.1,时间*.1+2.4); ctx.stroke(); }
    if(有('无敌')){ ctx.strokeStyle='rgba(255,235,130,'+(0.45+Math.sin(时间*.2)*0.35)+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(玩家.x+半,py+半,半+13,0,6.3); ctx.stroke(); }
    const 拉=clamp(1-玩家.vy*0.012,.82,1.2);
    ctx.save(); ctx.translate(玩家.x+半,py+半); ctx.scale(玩家.朝向*(2-拉),拉);
    if(受伤计时>0&&!有('无敌')) ctx.globalAlpha=Math.floor(时间*.25)%2?.32:.9;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,半,半*.34+4,4,0,0,6.3); ctx.fill();
    ctx.fillStyle='#fff'; 画图案(取图案(皮&&皮.图案)||{类型:'文字',文字:'🐰'},0,0,玩家.w,玩家.h); ctx.restore();
    ctx.globalAlpha=1;
  }
  画前景装饰();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of 飘字组){ ctx.globalAlpha=clamp(t.life/40,0,1); ctx.font='900 17px system-ui';
    ctx.fillStyle=t.色||A.高亮; ctx.fillText(t.文,t.x,t.y-相机); }
  ctx.globalAlpha=1;
  if(红闪>0){ ctx.globalAlpha=clamp(红闪/20,0,1)*.3; ctx.fillStyle='#ff2d4d'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}
function 小图(v){ v=String(v||'').trim();
  return /^(https?:|data:image)/i.test(v)?'<img src="'+v+'" style="width:16px;height:16px;object-fit:contain">':(v||'●'); }
function 画血(){
  const box=$('#hearts'); if(!box) return;
  if(!血开){ if(box._k!=='off'){ box._k='off'; box.innerHTML=''; } return; }
  const key=血+'/'+血上限;
  if(box._k===key) return; box._k=key;
  let h='';
  if((L.显示||'爱心')==='爱心' && 血上限<=8){
    for(let i=0;i<血上限;i++) h+='<span>'+(i<血?'❤️':'🤍')+'</span>';
  }else{
    h='<span class="hp"><b style="width:'+Math.round(血/Math.max(1,血上限)*100)+'%"></b></span>'
     +'<span class="num">'+血+' / '+血上限+'</span>';
  }
  box.innerHTML=h;
  box.className='hearts'+(血<=1?' low':'');
}

let 静音=!C.信息.音效, 音频=null;
function 响(hz,t){ if(静音) return;
  try{ if(!音频) 音频=new (window.AudioContext||window.webkitAudioContext)();
    const o=音频.createOscillator(), g=音频.createGain(); o.type='triangle'; o.frequency.value=hz;
    g.gain.setValueAtTime(.06,音频.currentTime); g.gain.exponentialRampToValueAtTime(.0001,音频.currentTime+t);
    o.connect(g); g.connect(音频.destination); o.start(); o.stop(音频.currentTime+t); }catch(e){}
}
function 头像(s){ const t=String(s.图案||'').trim();
  return /^(https?:|data:image)/i.test(t)?'<img src="'+t+'" alt="">':(t||'❓'); }
function 结束(){

  const 老=存档.最高分, 本=分数(); 存档.最高分=Math.max(老,本); 存盘(); 刷新最高();

  $('#fHurt').textContent=受伤数; $('#fHurtBox').style.display=血开?'':'none';
  红闪=0; 受伤计时=0;

}

}
function 开始(){ 显示(''); 开局(); }
$('#btnPlay').onclick=开始; $('#btnAgain').onclick=开始; $('#btnRestart').onclick=开始;
$('#btnResume').onclick=()=>{状态='play';上次=performance.now();显示('');};
$('#btnHome').onclick=()=>{状态='menu';显示('scMenu');};
$('#btnHome2').onclick=()=>{状态='menu';显示('scMenu');};
$('#pauseBtn').onclick=()=>{ if(状态==='play'){状态='pause';显示('scPause');} };
$('#btnSkins').onclick=()=>{画皮肤();显示('scSkins');};
$('#btnSkins2').onclick=()=>{画皮肤();显示('scSkins');};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{状态='menu';显示('scMenu');});
function 画皮肤(){
  const g=$('#skinGrid'); g.innerHTML='';
  C.皮肤.forEach((s,i)=>{
    const 解=(+s.解锁分数)<=存档.最高分;
    const el=document.createElement('div');
    el.className='skin'+(解?'':' lock')+(i===存档.当前皮肤?' sel':'');
    el.innerHTML='<div class="face">'+头像(s)+'</div><div class="nm">'+(s.名称||'角色')+'</div><div class="cond">'+
      (解?(i===存档.当前皮肤?'使用中':'点击使用'):'🔒 '+s.解锁分数+' 分')+'</div>';
    el.onclick=()=>{ if(!解){响(200,.15);return;} 存档.当前皮肤=i; 存盘(); 画皮肤(); 响(700,.08); };
    g.appendChild(el);
  });
  const 下=C.皮肤.filter(s=>+s.解锁分数>存档.最高分).sort((a,b)=>a.解锁分数-b.解锁分数)[0];
  $('#skinTip').textContent=下?('当前最高分 '+存档.最高分+'，再拿 '+(+下.解锁分数-存档.最高分)+' 分解锁「'+下.名称+'」。'):'所有角色都已解锁。';
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') 输入=-1;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') 输入=1;
  if(e.key==='Escape'){ if(状态==='play'){状态='pause';显示('scPause');} else if(状态==='pause'){状态='play';上次=performance.now();显示('');} }
});
addEventListener('keyup',e=>{
  if((e.key==='ArrowLeft'||e.key==='a'||e.key==='A')&&输入===-1) 输入=0;
  if((e.key==='ArrowRight'||e.key==='d'||e.key==='D')&&输入===1) 输入=0;
});
function 点X(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return t.clientX-r.left; }
$('#stage').addEventListener('pointerdown',e=>{ if(状态==='play') 手指X=点X(e); });
$('#stage').addEventListener('pointermove',e=>{ if(状态==='play'&&手指X!==null) 手指X=点X(e); });
addEventListener('pointerup',()=>手指X=null); addEventListener('pointercancel',()=>手指X=null);
document.addEventListener('touchmove',e=>{ if(e.target.closest('#stage')&&!e.target.closest('.screen')) e.preventDefault(); },{passive:false});
let 上次=performance.now();
function 循环(now){
  const dt=clamp((now-上次)/16.667,0,2.4); 上次=now;
  装饰更新(dt);
  if(状态==='play') 更新(dt);
  if(玩家) 绘制(); else { 画背景(); 画前景装饰(); }
  requestAnimationFrame(循环);
}
(async function(){ await 读档(); 调整(); 建装饰(); 布置封面(); 刷新最高();
  $('#hBest').textContent=存档.最高分; requestAnimationFrame(循环); })();

</script>
</body>
